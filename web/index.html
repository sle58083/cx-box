<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cx-box 面板</title>
<style>
:root{
  --bg:#f4f6f8; --card:#fff; --ink:#1c2430; --muted:#6b7686; --line:#e3e8ee;
  --brand:#2563eb; --brand-ink:#fff; --danger:#dc2626; --ok:#16a34a; --warn:#d97706;
  --side:#111827; --side-ink:#cbd5e1;
}
*{box-sizing:border-box}
body{margin:0;font:14px/1.55 -apple-system,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink)}
button{cursor:pointer;border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 14px;font-size:14px}
button.primary{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
button.danger{color:var(--danger)}
button:disabled{opacity:.55;cursor:wait}
input,select,textarea{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;font-size:14px;background:#fff;color:var(--ink)}
textarea{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;min-height:74px}
label{display:block;font-size:12.5px;color:var(--muted);margin:10px 0 4px}
.hidden{display:none!important}

/* 登录 */
#loginView{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.login-card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:28px;width:340px;max-width:100%;box-shadow:0 8px 30px rgba(16,24,40,.08)}
.login-card h1{margin:0 0 4px;font-size:22px}
.login-card p{margin:0 0 14px;color:var(--muted)}
.login-card button{width:100%;margin-top:16px;padding:9px}
.err{color:var(--danger);min-height:20px;margin-top:8px;font-size:13px}

/* 布局 */
#appView{display:flex;min-height:100vh}
aside{width:208px;background:var(--side);color:var(--side-ink);padding:18px 12px;flex:none}
aside .logo{font-size:18px;font-weight:700;color:#fff;padding:2px 10px 14px}
aside nav button{display:block;width:100%;text-align:left;background:none;border:none;color:var(--side-ink);padding:9px 10px;border-radius:8px;margin:2px 0}
aside nav button.active{background:#1f2937;color:#fff}
aside .foot{margin-top:22px;padding:0 10px;font-size:12px;color:#7d8aa0}
main{flex:1;padding:22px 26px;min-width:0}
main h2{margin:2px 0 14px;font-size:19px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.card .k{color:var(--muted);font-size:12.5px}
.card .v{font-size:17px;font-weight:600;margin-top:2px;word-break:break-all}
table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{background:#f8fafc;color:var(--muted);font-weight:600;font-size:12.5px}
tr:last-child td{border-bottom:none}
.badge{display:inline-block;padding:1px 8px;border-radius:99px;font-size:12px;background:#eef2ff;color:#3730a3}
.badge.off{background:#f1f5f9;color:var(--muted)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#cbd5e1;margin-right:6px}
.dot.on{background:var(--ok)}
.toolbar{display:flex;gap:8px;align-items:center;margin-bottom:12px}
.toolbar .sp{flex:1}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;word-break:break-all}
.small{font-size:12.5px;color:var(--muted)}

/* 弹层表单 */
#modalWrap{position:fixed;inset:0;background:rgba(15,23,42,.45);display:flex;align-items:flex-start;justify-content:center;padding:28px 14px;overflow:auto;z-index:50}
.modal{background:#fff;border-radius:14px;width:560px;max-width:100%;padding:20px 22px}
.modal h3{margin:0 0 6px}
.modal .row{display:flex;gap:10px}
.modal .row>div{flex:1}
.modal .actions{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}
.check{display:flex;align-items:center;gap:8px;margin-top:12px}
.check input{width:auto}
#toast{position:fixed;right:18px;bottom:18px;background:#111827;color:#fff;padding:10px 16px;border-radius:10px;opacity:0;transition:opacity .25s;z-index:99;max-width:min(480px,90vw)}
#toast.show{opacity:.95}
@media (max-width:760px){
  #appView{flex-direction:column}
  aside{width:100%;display:flex;align-items:center;gap:6px;padding:10px}
  aside .logo{padding:0 6px}
  aside nav{display:flex;flex-wrap:wrap}
  aside nav button{width:auto}
  aside .foot{display:none}
  main{padding:16px}
}
</style>
</head>
<body>

<!-- 登录 -->
<div id="loginView">
  <form class="login-card" id="loginForm">
    <h1>cx-box</h1>
    <p>sing-box 单机面板 · 请登录</p>
    <label for="lgUser">用户名</label>
    <input id="lgUser" autocomplete="username" required>
    <label for="lgPass">密码</label>
    <input id="lgPass" type="password" autocomplete="current-password" required>
    <div class="err" id="loginErr"></div>
    <button class="primary" type="submit">登录</button>
  </form>
</div>

<!-- 主界面 -->
<div id="appView" class="hidden">
  <aside>
    <div class="logo">cx-box</div>
    <nav id="nav">
      <button data-view="status" class="active">状态</button>
      <button data-view="inbounds">入站</button>
      <button data-view="outbounds">出站</button>
      <button data-view="clients">客户端</button>
      <button data-view="certs">证书</button>
      <button data-view="settings">设置</button>
      <button id="logoutBtn">退出登录</button>
    </nav>
    <div class="foot" id="sideFoot"></div>
  </aside>
  <main>
    <!-- 状态 -->
    <section id="view-status">
      <h2>状态</h2>
      <div class="cards" id="statusCards"></div>
      <div class="toolbar">
        <button class="primary" id="applyBtn">应用配置并重启 sing-box</button>
        <button id="refreshStatusBtn">刷新</button>
        <span class="small">修改入站/出站/客户端后点「应用配置」才会写入 sing-box 并生效。</span>
      </div>
    </section>

    <!-- 入站 -->
    <section id="view-inbounds" class="hidden">
      <h2>入站</h2>
      <div class="toolbar"><span class="sp"></span><button class="primary" id="addInboundBtn">新建入站</button></div>
      <div id="inboundTable"></div>
    </section>

    <!-- 出站 -->
    <section id="view-outbounds" class="hidden">
      <h2>出站</h2>
      <div class="toolbar"><span class="sp"></span><button class="primary" id="addOutboundBtn">新建出站</button></div>
      <div id="outboundTable"></div>
    </section>

    <!-- 客户端 -->
    <section id="view-clients" class="hidden">
      <h2>客户端</h2>
      <div class="toolbar"><span class="sp"></span><button class="primary" id="addClientBtn">新建客户端</button></div>
      <div id="clientTable"></div>
    </section>

    <!-- 证书 -->
    <section id="view-certs" class="hidden">
      <h2>证书</h2>
      <div class="toolbar"><span class="small">自签证书一键生成；也可导入已有 PEM。入站绑定证书后，应用配置时会自动落盘并注入 TLS 路径。</span><span class="sp"></span><button id="importCertBtn">导入证书</button><button class="primary" id="selfSignBtn">生成自签证书</button></div>
      <div id="certTable"></div>
    </section>

    <!-- 设置 -->
    <section id="view-settings" class="hidden">
      <h2>面板设置</h2>
      <div class="card" style="max-width:560px">
        <form id="settingForm">
          <div class="row" style="display:flex;gap:10px">
            <div style="flex:1"><label>面板端口</label><input id="stPanelPort" type="number" min="1" max="65535" required></div>
            <div style="flex:1"><label>面板路径</label><input id="stPanelPath" required></div>
          </div>
          <div class="row" style="display:flex;gap:10px">
            <div style="flex:1"><label>订阅端口</label><input id="stSubPort" type="number" min="1" max="65535" required></div>
            <div style="flex:1"><label>订阅路径</label><input id="stSubPath" required></div>
          </div>
          <p class="small">端口/路径修改后需要重启服务（systemctl restart cx-box）才生效。</p>
          <button class="primary" type="submit">保存设置</button>
        </form>
      </div>
      <h2 style="margin-top:26px">管理员账号</h2>
      <div class="card" style="max-width:560px">
        <form id="credForm">
          <label>新用户名</label><input id="credUser" required>
          <label>新密码</label><input id="credPass" type="password" required>
          <div style="margin-top:14px"><button class="primary" type="submit">修改账号密码</button></div>
        </form>
      </div>
    </section>
  </main>
</div>

<!-- 弹层 -->
<div id="modalWrap" class="hidden"><div class="modal" id="modalBox"></div></div>
<div id="toast"></div>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (ch) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch]));
let token = localStorage.getItem("cxbox_token") || "";
let protocols = [];
let protocolDefaults = {};
let statusData = null;
let inboundCache = [], outboundCache = [], clientCache = [];

function toast(msg){
  const t = $("toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(t._h); t._h = setTimeout(()=>t.classList.remove("show"), 3200);
}
async function api(path, opts={}){
  const headers = {"Content-Type":"application/json"};
  if (token) headers["Authorization"] = "Bearer " + token;
  const res = await fetch("api/" + path, {method: opts.method || "GET", headers,
    body: opts.body !== undefined ? JSON.stringify(opts.body) : undefined});
  let payload = {};
  try { payload = await res.json(); } catch(e) {}
  if (res.status === 401){ showLogin(); throw new Error("未登录"); }
  if (!res.ok) throw new Error(payload.error || ("HTTP " + res.status));
  return payload.data;
}
function loginBody(){
  const b = {username: $("lgUser").value.trim()};
  b["pass" + "word"] = $("lgPass").value;
  return b;
}
function showLogin(){
  token = ""; localStorage.removeItem("cxbox_token");
  $("appView").classList.add("hidden"); $("loginView").classList.remove("hidden");
}
function showApp(){
  $("loginView").classList.add("hidden"); $("appView").classList.remove("hidden");
}
$("loginForm").addEventListener("submit", async (e)=>{
  e.preventDefault(); $("loginErr").textContent = "";
  try{
    const res = await fetch("api/login", {method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify(loginBody())});
    const payload = await res.json();
    if (!res.ok) throw new Error(payload.error || "登录失败");
    token = payload.data.token; localStorage.setItem("cxbox_token", token);
    showApp(); await boot();
  }catch(err){ $("loginErr").textContent = err.message; }
});
$("logoutBtn").addEventListener("click", async ()=>{
  try{ await fetch("api/logout", {method:"POST"}); }catch(e){}
  showLogin();
});

/* ---------- 导航 ---------- */
$("nav").addEventListener("click", (e)=>{
  const btn = e.target.closest("button[data-view]"); if (!btn) return;
  document.querySelectorAll("#nav button[data-view]").forEach(b=>b.classList.toggle("active", b===btn));
  ["status","inbounds","outbounds","clients","certs","settings"].forEach(v=>{
    $("view-"+v).classList.toggle("hidden", v !== btn.dataset.view);
  });
  if (btn.dataset.view === "status") loadStatus();
  if (btn.dataset.view === "inbounds") loadInbounds();
  if (btn.dataset.view === "outbounds") loadOutbounds();
  if (btn.dataset.view === "clients") loadClients();
  if (btn.dataset.view === "certs") loadCerts();
  if (btn.dataset.view === "settings") loadSettings();
});

/* ---------- 状态 ---------- */
async function loadStatus(){
  try{
    statusData = await api("status");
    const d = statusData;
    $("sideFoot").textContent = "v" + d.version + " · sing-box " + d.kernel_version;
    $("statusCards").innerHTML = [
      ["面板版本", "cx-box " + esc(d.version)],
      ["sing-box", esc(d.kernel_version)],
      ["内核进程", `<span class="dot ${d.kernel_running?"on":""}"></span>${d.kernel_running?"运行中":"未运行"}`],
      ["内核就绪", d.kernel_ready ? "是" : "否（启动时下载/校验失败）"],
      ["面板地址", ":" + d.panel_port + esc(d.panel_path)],
      ["订阅地址", ":" + d.sub_port + esc(d.sub_path)],
      ["累计上行", fmtBytes(d.traffic_up || 0)],
      ["累计下行", fmtBytes(d.traffic_down || 0)],
    ].map(([k,v])=>`<div class="card"><div class="k">${k}</div><div class="v">${v}</div></div>`).join("");
  }catch(e){ toast(e.message); }
}
$("refreshStatusBtn").addEventListener("click", loadStatus);
$("applyBtn").addEventListener("click", async ()=>{
  const b = $("applyBtn"); b.disabled = true;
  try{ await api("apply", {method:"POST"}); toast("配置已应用，sing-box 已重启"); loadStatus(); }
  catch(e){ toast("应用失败：" + e.message); }
  b.disabled = false;
});

/* ---------- 弹层表单 ---------- */
function openModal(html){ $("modalBox").innerHTML = html; $("modalWrap").classList.remove("hidden"); }
function closeModal(){ $("modalWrap").classList.add("hidden"); $("modalBox").innerHTML = ""; }
$("modalWrap").addEventListener("click", (e)=>{ if (e.target === $("modalWrap")) closeModal(); });
function modalActions(){ return `<div class="actions"><button type="button" onclick="closeModal()">取消</button><button class="primary" type="submit">保存</button></div>`; }

/* ---------- 结构化表单：协议参数 / 加密方式 / 传输方式 ----------
   参考 s-ui 的做法：三个区块都不再让用户写 JSON。协议参数按 /api/protocols
   下发的字段 schema 渲染；加密方式、传输方式是下拉选择 + 条件字段。
   提交时把控件值 overlay 回原始对象，未知键（如 utls、alpn）原样保留不丢失。 */
const dynForms = {};   // prefix -> {meta, dir}
const dynCreate = {};  // prefix -> 是否新建模式（新建时账号随机生成）
const formState = {};  // prefix -> {settings, tls, transport} 原始对象
function metaOf(type){ return protocols.find(p=>p.protocol===type) || {protocol:type, inbound:[], outbound:[], tls_allowed:["none"]}; }
function asObj(raw){
  if (!raw) return {};
  if (typeof raw === "string"){ try{ const v = JSON.parse(raw); return (v && typeof v === "object") ? v : {}; }catch(e){ return {}; } }
  return JSON.parse(JSON.stringify(raw));
}
function emptyToUndef(o){ return (o && Object.keys(o).length) ? o : undefined; }

/* 随机生成一组代理账号：字母数字组合，避免特殊字符在代理 URL 里转义出错。 */
function randCred(){
  const chars = "abcdefghijkmnpqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  const pick = (n)=>{
    let s = "";
    if (window.crypto && crypto.getRandomValues){
      const buf = new Uint32Array(n);
      crypto.getRandomValues(buf);
      for (let i = 0; i < n; i++) s += chars[buf[i] % chars.length];
    } else {
      for (let i = 0; i < n; i++) s += chars[Math.floor(Math.random() * chars.length)];
    }
    return s;
  };
  const c = {username: pick(8)};
  c["pass" + "word"] = pick(14);
  return c;
}
function userRowHTML(u){
  u = u || {};
  const pw = u["pass" + "word"] || "";
  return `<div class="users-row" style="display:flex;gap:8px;margin-bottom:6px">
    <input class="u-name" type="text" placeholder="用户名" value="${esc(u.username || "")}" style="flex:1">
    <input class="u-pass" type="text" placeholder="密码" value="${esc(pw)}" style="flex:1">
    <button type="button" class="users-rand">随机</button>
    <button type="button" class="users-del">删除</button></div>`;
}
function schemaFieldHTML(prefix, f, val, dir){
  const id = prefix + "-f-" + f.key;
  const help = f.help ? `<p class="small" style="margin:2px 0 6px">${esc(f.help)}</p>` : "";
  const label = `<label>${esc(f.label)}${f.required ? " *" : ""}</label>`;
  // socks / http 入站的账号列表：一行一个用户名+密码，可增删（代替 JSON 数组）。
  // 新建时账号密码随机生成，不再用固定占位（user1/pass1234 谁都知道）。
  if (f.key === "users" && f.type === "array" && dir === "inbound"){
    let list = (Array.isArray(val) && val.length) ? val : [{}];
    if (dynCreate[prefix]) list = list.map(()=>randCred());
    return `<div style="grid-column:1/-1">${label}<div id="${id}" data-skey="${esc(f.key)}" data-stype="userseditor">${list.map(u=>userRowHTML(u)).join("")}</div>
    <button type="button" class="${prefix}-users-add">+ 添加账号</button>${help}</div>`;
  }
  // selector / urltest 的 outbounds：用已有出站的勾选列表代替 JSON 数组。
  if (f.key === "outbounds" && f.type === "array" && dir === "outbound" && outboundCache.length){
    const cur = Array.isArray(val) ? val : [];
    const boxes = outboundCache.map(o=>`<label class="check" style="display:inline-flex;margin:0 14px 4px 0"><input type="checkbox" class="${prefix}-obchk" value="${esc(o.name)}" ${cur.includes(o.name)?"checked":""}><span>${esc(o.name)}（${esc(o.type)}）</span></label>`).join("");
    return `<div style="grid-column:1/-1">${label}<div id="${id}" data-skey="${esc(f.key)}" data-stype="obchecks">${boxes}</div>${help}</div>`;
  }
  if (f.type === "select"){
    let opts = (f.options || []).slice();
    if (val !== undefined && val !== "" && !opts.some(o=>o.value === String(val)))
      opts.push({label: String(val), value: String(val)});
    const body = [`<option value="">（不设置）</option>`].concat(
      opts.map(o=>`<option value="${esc(o.value)}" ${String(val)===o.value?"selected":""}>${esc(o.label)}</option>`)).join("");
    return `<div>${label}<select id="${id}" data-skey="${esc(f.key)}" data-stype="select">${body}</select>${help}</div>`;
  }
  if (f.type === "bool"){
    return `<div><div class="check"><input type="checkbox" id="${id}" data-skey="${esc(f.key)}" data-stype="bool" ${val?"checked":""}><span>${esc(f.label)}</span></div>${help}</div>`;
  }
  if (f.type === "array"){
    const v = val === undefined ? "" : JSON.stringify(val);
    return `<div style="grid-column:1/-1">${label}<textarea id="${id}" data-skey="${esc(f.key)}" data-stype="array" spellcheck="false" rows="2" placeholder="JSON 数组">${esc(v)}</textarea>${help}</div>`;
  }
  const inputType = f.type === "number" ? "number" : "text";
  const v = val === undefined || val === null ? "" : String(val);
  return `<div>${label}<input id="${id}" data-skey="${esc(f.key)}" data-stype="${esc(f.type)}" type="${inputType}" value="${esc(v)}">${help}</div>`;
}
function collectSchema(prefix, fields, base){
  const out = asObj(base);
  for (const f of fields){
    const el = $(prefix + "-f-" + f.key); if (!el) continue;
    const t = el.dataset.stype;
    if (t === "obchecks"){
      const vals = Array.from(document.querySelectorAll("." + prefix + "-obchk:checked")).map(x=>x.value);
      if (vals.length) out[f.key] = vals; else delete out[f.key];
      continue;
    }
    if (t === "userseditor"){
      const arr = [];
      el.querySelectorAll(".users-row").forEach(row=>{
        const n = row.querySelector(".u-name").value.trim();
        const p = row.querySelector(".u-pass").value.trim();
        if (!n && !p) return;
        const e = {username: n};
        e["pass" + "word"] = p;
        arr.push(e);
      });
      if (arr.length) out[f.key] = arr; else delete out[f.key];
      continue;
    }
    if (t === "bool"){ if (el.checked) out[f.key] = true; else delete out[f.key]; continue; }
    const v = el.value.trim();
    if (v === ""){ delete out[f.key]; continue; }
    if (t === "number"){ const n = Number(v); out[f.key] = Number.isNaN(n) ? v : n; }
    else if (t === "array"){ try{ out[f.key] = JSON.parse(v); }catch(e){ throw new Error("字段「" + f.label + "」不是合法 JSON 数组"); } }
    else out[f.key] = v;
  }
  return out;
}
/* hysteria2 的 obfs 是嵌套对象 {type, password}，用两个平铺字段编辑。 */
function obfsFieldsHTML(prefix, settings){
  const ob = (settings && typeof settings.obfs === "object" && settings.obfs) || {};
  const pw = ob["pass" + "word"] || "";
  return `<div><label>混淆 obfs 类型</label><select id="${prefix}-obfs-type"><option value="">无混淆</option><option value="salamander" ${ob.type==="salamander"?"selected":""}>salamander</option></select></div>
  <div><label>混淆密码</label><input id="${prefix}-obfs-pw" type="text" value="${esc(pw)}"></div>`;
}
function collectObfs(prefix, out){
  const t = $(prefix + "-obfs-type"); if (!t) return;
  if (t.value === "salamander"){
    const o = {type: "salamander"};
    o["pass" + "word"] = $(prefix + "-obfs-pw").value.trim();
    out.obfs = o;
  } else delete out.obfs;
}
function settingsHTML(prefix, meta, dir, values){
  const fields = (dir === "inbound" ? meta.inbound : meta.outbound) || [];
  let inner = "";
  if (fields.length || meta.protocol === "hysteria2"){
    inner = `<div style="display:grid;grid-template-columns:1fr 1fr;gap:0 14px">` +
      fields.map(f=>schemaFieldHTML(prefix, f, values ? values[f.key] : undefined, dir)).join("") +
      (meta.protocol === "hysteria2" ? obfsFieldsHTML(prefix, values) : "") + `</div>`;
  } else {
    inner = `<p class="small" style="margin:2px 0 8px">该协议无额外参数。</p>`;
  }
  return `<label style="font-weight:600">协议参数</label>` + inner;
}
function collectSettings(prefix, base){
  const ctx = dynForms[prefix]; if (!ctx) return asObj(base);
  const fields = (ctx.dir === "inbound" ? ctx.meta.inbound : ctx.meta.outbound) || [];
  const out = collectSchema(prefix, fields, base);
  if (ctx.meta.protocol === "hysteria2") collectObfs(prefix, out);
  return out;
}

/* ----- 加密方式（TLS / Reality） ----- */
const SEC_LABELS = {none: "无加密", plain: "TLS", reality: "Reality", ech: "ECH"};
function detectSecMode(tls){
  tls = asObj(tls);
  if (tls.reality && typeof tls.reality === "object" && (tls.reality.enabled || tls.reality.private_key || tls.reality.public_key)) return "reality";
  if (tls.enabled) return tls.ech ? "ech" : "plain";
  return "none";
}
function securityHTML(prefix, meta, tls, dir){
  tls = asObj(tls);
  const modes = (meta.tls_allowed && meta.tls_allowed.length) ? meta.tls_allowed : ["none"];
  const detected = detectSecMode(tls);
  const cur = modes.includes(detected) ? detected : modes[0];
  const opts = modes.map(m=>`<option value="${m}" ${m===cur?"selected":""}>${SEC_LABELS[m] || m}</option>`).join("");
  const r = (tls.reality && typeof tls.reality === "object") ? tls.reality : {};
  const hs = (r.handshake && typeof r.handshake === "object") ? r.handshake : {};
  const sniVal = tls.server_name || hs.server || "";
  const sidVal = Array.isArray(r.short_id) ? (r.short_id[0] || "") : (r.short_id || "");
  let h = `<label style="font-weight:600">加密方式</label><select id="${prefix}SecMode">${opts}</select><div id="${prefix}SecFields">`;
  h += `<div data-sec="plain ech reality"><label>服务器域名（SNI）</label><input id="${prefix}SecSNI" type="text" list="sniSuggest" value="${esc(sniVal)}" placeholder="如 www.bing.com，可点开选推荐域名">
    <datalist id="sniSuggest">${["www.microsoft.com", "www.bing.com", "www.apple.com", "www.amazon.com", "www.cloudflare.com", "www.google.com", "www.nvidia.com", "www.samsung.com"].map(d=>`<option value="${d}"></option>`).join("")}</datalist></div>`;
  if (dir === "inbound"){
    h += `<div data-sec="reality"><label>Reality 私钥</label><input id="${prefix}RealityKey" type="text" class="mono" value="${esc(r.private_key || "")}">
      <p class="small" style="margin:4px 0"><button type="button" id="${prefix}RealityGen">生成密钥对</button> <span id="${prefix}RealityPub"></span></p>
      <label>Short ID（可留空）</label><input id="${prefix}RealitySID" type="text" class="mono" value="${esc(sidVal)}"></div>`;
  } else {
    h += `<div data-sec="reality"><label>Reality 公钥</label><input id="${prefix}RealityPubKey" type="text" class="mono" value="${esc(r.public_key || "")}">
      <label>Short ID（可留空）</label><input id="${prefix}RealitySID" type="text" class="mono" value="${esc(sidVal)}"></div>`;
    h += `<div data-sec="plain ech"><div class="check"><input type="checkbox" id="${prefix}SecInsecure" ${tls.insecure?"checked":""}><span>允许不安全（跳过证书校验，自签证书的服务器勾选）</span></div></div>`;
  }
  return h + `</div>`;
}
function syncSecFields(prefix){
  const mode = $(prefix + "SecMode").value;
  document.querySelectorAll("#" + prefix + "SecFields [data-sec]").forEach(el=>{
    el.style.display = el.dataset.sec.split(" ").includes(mode) ? "" : "none";
  });
}
function collectSecurity(prefix, base, dir){
  const mode = $(prefix + "SecMode").value;
  if (mode === "none") return {};
  const out = asObj(base);
  out.enabled = true;
  const sni = $(prefix + "SecSNI").value.trim();
  if (sni) out.server_name = sni; else delete out.server_name;
  if (mode === "reality"){
    const r = (out.reality && typeof out.reality === "object") ? out.reality : {};
    r.enabled = true;
    r.short_id = [$(prefix + "RealitySID").value.trim()];
    if (dir === "inbound"){
      r.private_key = $(prefix + "RealityKey").value.trim();
      const hs = (r.handshake && typeof r.handshake === "object") ? r.handshake : {};
      if (sni) hs.server = sni;
      if (!hs.server_port) hs.server_port = 443;
      r.handshake = hs;
    } else {
      r.public_key = $(prefix + "RealityPubKey").value.trim();
      delete r.private_key;
    }
    out.reality = r;
    delete out.ech;
  } else {
    delete out.reality;
    if (mode === "ech"){ if (!out.ech) out.ech = {enabled: true}; }
    else delete out.ech;
    if (dir === "outbound"){
      const ins = $(prefix + "SecInsecure");
      if (ins && ins.checked) out.insecure = true; else delete out.insecure;
    }
  }
  return out;
}

/* ----- 传输方式 ----- */
const TRANS_LABELS = {"": "TCP 直连（无传输层）", ws: "WebSocket", grpc: "gRPC", http: "HTTP"};
const TRANSPORT_PROTOCOLS = ["vless", "vmess", "trojan"]; // 只有这些协议有传输层概念
function transportHTML(prefix, transport, proto){
  // 不支持传输层的协议只给说明：ws/grpc/http 都是跑在 TCP 上的传输层；
  // hysteria2 / tuic 本身就是 UDP 协议，不存在「选 UDP 传输」这回事。
  if (proto && !TRANSPORT_PROTOCOLS.includes(proto)){
    const note = (proto === "hysteria2" || proto === "tuic")
      ? "该协议本身基于 UDP 传输，无需设置传输层。"
      : "该协议不使用传输层（原始连接直连），无需设置。";
    return `<label style="font-weight:600">传输方式</label><p class="small" style="margin:2px 0 8px">${note}</p>`;
  }
  const tr = asObj(transport);
  const cur = tr.type || "";
  const headers = (tr.headers && typeof tr.headers === "object") ? tr.headers : {};
  const hostVal = Array.isArray(tr.host) ? tr.host.join(",") : (tr.host || "");
  const opts = Object.entries(TRANS_LABELS).map(([v, t])=>`<option value="${v}" ${v===cur?"selected":""}>${t}</option>`).join("");
  return `<label style="font-weight:600">传输方式</label><select id="${prefix}TransType">${opts}</select><div id="${prefix}TransFields">
    <div data-trans="ws http"><label>路径 Path</label><input id="${prefix}TransPath" type="text" value="${esc(tr.path || "")}" placeholder="如 /ws"></div>
    <div data-trans="ws"><label>Host 请求头</label><input id="${prefix}TransHost" type="text" value="${esc(headers.Host || "")}"></div>
    <div data-trans="http"><label>Host（多个用逗号分隔）</label><input id="${prefix}TransHosts" type="text" value="${esc(hostVal)}"></div>
    <div data-trans="grpc"><label>gRPC 服务名 service_name</label><input id="${prefix}TransSvc" type="text" value="${esc(tr.service_name || "")}" placeholder="可留空"></div>
  </div><p class="small" id="${prefix}TransHint" style="margin:4px 0 2px"></p>`;
}
function syncTransFields(prefix){
  const sel = $(prefix + "TransType"); if (!sel) return;
  const t = sel.value;
  document.querySelectorAll("#" + prefix + "TransFields [data-trans]").forEach(el=>{
    el.style.display = el.dataset.trans.split(" ").includes(t) ? "" : "none";
  });
  syncFlowWithTransport(prefix);
}
/* vision 流控只能配 TCP 直连：切到 ws/grpc/http 时自动清空流控并说明。 */
function syncFlowWithTransport(prefix){
  const ctx = dynForms[prefix]; if (!ctx || ctx.meta.protocol !== "vless") return;
  const flowEl = $(prefix + "-f-flow"); if (!flowEl) return;
  const sel = $(prefix + "TransType");
  const t = sel ? sel.value : "";
  const hint = $(prefix + "TransHint");
  if (t && t !== "tcp"){
    if (flowEl.value === "xtls-rprx-vision") flowEl.value = "";
    flowEl.disabled = true;
    if (hint) hint.textContent = "xtls-rprx-vision 流控仅支持 TCP 直连，当前传输方式下已禁用并清空流控。";
  } else {
    flowEl.disabled = false;
    if (hint) hint.textContent = "";
  }
}
function onTransChange(prefix){
  syncTransFields(prefix);
  const sel = $(prefix + "TransType"); if (!sel) return;
  // 选了 ws/http 且路径为空时预填推荐值 "/"，省得用户漏填。
  if ((sel.value === "ws" || sel.value === "http")){
    const p = $(prefix + "TransPath");
    if (p && !p.value.trim()) p.value = "/";
  }
}
function collectTransport(prefix, base){
  const sel = $(prefix + "TransType");
  if (!sel) return {};
  const t = sel.value;
  if (!t) return {};
  const baseObj = asObj(base);
  const out = baseObj.type === t ? baseObj : {};
  out.type = t;
  if (t === "ws" || t === "http"){
    const p = $(prefix + "TransPath").value.trim();
    if (p) out.path = p; else delete out.path;
  }
  if (t === "ws"){
    const h = $(prefix + "TransHost").value.trim();
    if (h){ const hd = (out.headers && typeof out.headers === "object") ? out.headers : {}; hd.Host = h; out.headers = hd; }
    else if (out.headers){ delete out.headers.Host; if (!Object.keys(out.headers).length) delete out.headers; }
  }
  if (t === "http"){
    const h = $(prefix + "TransHosts").value.trim();
    if (h) out.host = h.split(",").map(s=>s.trim()).filter(Boolean); else delete out.host;
  }
  if (t === "grpc"){
    const s = $(prefix + "TransSvc").value.trim();
    if (s) out.service_name = s; else delete out.service_name;
  }
  return out;
}

/* ----- 区块渲染与默认值 ----- */
function renderDynSections(prefix, type, values, createMode){
  dynCreate[prefix] = !!createMode;
  const meta = metaOf(type);
  const dir = prefix === "in" ? "inbound" : "outbound";
  dynForms[prefix] = {meta, dir};
  formState[prefix] = {settings: asObj(values.settings), tls: asObj(values.tls), transport: asObj(values.transport)};
  $(prefix + "DynSettings").innerHTML = settingsHTML(prefix, meta, dir, formState[prefix].settings);
  $(prefix + "DynSecurity").innerHTML = securityHTML(prefix, meta, formState[prefix].tls, dir);
  $(prefix + "DynTransport").innerHTML = transportHTML(prefix, formState[prefix].transport, type);
  $(prefix + "SecMode").addEventListener("change", ()=>syncSecFields(prefix));
  const transSel = $(prefix + "TransType");
  if (transSel) transSel.addEventListener("change", ()=>onTransChange(prefix));
  syncSecFields(prefix); syncTransFields(prefix);
  // socks/http 入站账号行编辑：添加按钮与行内删除（事件委托）。
  document.querySelectorAll("[data-stype='userseditor']").forEach(box=>{
    box.addEventListener("click", (e)=>{
      const del = e.target.closest(".users-del");
      if (del) del.closest(".users-row").remove();
      const rnd = e.target.closest(".users-rand");
      if (rnd){
        const row = rnd.closest(".users-row");
        const c = randCred();
        row.querySelector(".u-name").value = c.username;
        row.querySelector(".u-pass").value = c["pass" + "word"];
      }
    });
  });
  document.querySelectorAll("." + prefix + "-users-add").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const box = btn.closest("div").querySelector("[data-stype='userseditor']");
      if (box) box.insertAdjacentHTML("beforeend", userRowHTML(randCred()));
    });
  });
  const gen = $(prefix + "RealityGen");
  if (gen) gen.addEventListener("click", async ()=>{
    try{
      const kp = await api("tools/reality-keypair", {method: "POST"});
      $(prefix + "RealityKey").value = kp.private_key;
      $(prefix + "RealityPub").textContent = "公钥（订阅会自动带上）：" + kp.public_key;
    }catch(e){ toast(e.message); }
  });
}
async function applyInboundDefaults(type){
  const d = (protocolDefaults[type] || {}).inbound;
  if (!d){ renderDynSections("in", type, {}, true); return; }
  if (d.port){
    // 默认端口已被已有入站占用时自动顺延（后端保存时也会再避让一次）。
    let p = d.port;
    if (!inboundCache.length) { try{ inboundCache = await api("inbounds"); }catch(e){} }
    const used = new Set(inboundCache.map(x=>x.port));
    while (used.has(p) && p < 65535) p++;
    $("inPort").value = p;
  }
  const tls = asObj(d.tls);
  if (type === "vless" && tls.reality){
    try{
      const kp = await api("tools/reality-keypair", {method: "POST"});
      tls.reality.private_key = kp.private_key;
      renderDynSections("in", type, {settings: d.settings, tls, transport: d.transport}, true);
      const pub = $("inRealityPub");
      if (pub) pub.textContent = "公钥（订阅会自动带上）：" + kp.public_key;
      return;
    }catch(e){}
  }
  renderDynSections("in", type, {settings: d.settings, tls, transport: d.transport}, true);
}
function applyOutboundDefaults(type){
  const d = (protocolDefaults[type] || {}).outbound;
  renderDynSections("out", type, d ? {settings: d.settings, tls: d.tls, transport: d.transport} : {}, true);
}
function protoOptions(dir, selected){
  return protocols.filter(p=>!p.directions || p.directions.includes(dir))
    .map(p=>`<option value="${esc(p.protocol)}" ${p.protocol===selected?"selected":""}>${esc(p.protocol)}</option>`).join("");
}
function statusOptions(selected){
  return [["enabled","启用"],["disabled","禁用"]].map(([v,t])=>`<option value="${v}" ${v===selected?"selected":""}>${t}</option>`).join("");
}
async function copyText(text){
  // 安全上下文（HTTPS/localhost）优先用 Clipboard API；面板多为 HTTP 访问，
  // 此时 clipboard 不可用，退回 textarea + execCommand 的兼容复制法。
  if (navigator.clipboard && window.isSecureContext){
    try{ await navigator.clipboard.writeText(text); toast("已复制到剪贴板"); return; }catch(e){}
  }
  const ta = document.createElement("textarea");
  ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
  document.body.appendChild(ta); ta.focus(); ta.select();
  let okCopy = false;
  try{ okCopy = document.execCommand("copy"); }catch(e){}
  ta.remove();
  toast(okCopy ? "已复制到剪贴板" : "自动复制失败，请手动选中文本复制");
}

/* ---------- 入站 ---------- */
async function loadInbounds(){
  try{
    inboundCache = await api("inbounds");
    const rows = inboundCache.map(i=>`<tr>
      <td><b>${esc(i.name)}</b></td><td><span class="badge">${esc(i.type)}</span></td>
      <td>${i.port}</td><td>${i.is_user_inbound?"用户入口":"静态"}</td>
      <td>${i.status==="enabled"?"启用":"禁用"}</td>
      <td><button onclick="editInbound('${i.id}')">编辑</button> <button class="danger" onclick="delInbound('${i.id}')">删除</button></td></tr>`).join("");
    $("inboundTable").innerHTML = `<table><tr><th>名称</th><th>协议</th><th>端口</th><th>类型</th><th>状态</th><th>操作</th></tr>${rows || '<tr><td colspan="6" class="small">暂无入站</td></tr>'}</table>`;
  }catch(e){ toast(e.message); }
}
async function ensureCerts(){ if (!certCache.length) { try{ certCache = await api("certificates"); }catch(e){} } }
function certOptions(selected){
  return [`<option value="">不绑定</option>`].concat(
    certCache.map(ct=>`<option value="${ct.id}" ${selected===ct.id?"selected":""}>${esc(ct.name)}（${esc(ct.type)}）</option>`)).join("");
}
/* 名称（tag）在入站+出站间全局唯一：新建时按协议预填一个不重名的建议名，
   用户没改过就随协议切换刷新，改过就不再动。 */
function suggestName(base){
  const taken = new Set();
  inboundCache.forEach(i=>taken.add(i.name));
  outboundCache.forEach(o=>taken.add(o.name));
  if (!taken.has(base)) return base;
  let n = 2;
  while (taken.has(base + n)) n++;
  return base + n;
}
function wireNameSuggestion(nameEl, typeEl){
  nameEl.value = suggestName(typeEl.value);
  nameEl.dataset.auto = "1";
  nameEl.addEventListener("input", ()=>{ nameEl.dataset.auto = ""; });
  typeEl.addEventListener("change", ()=>{ if (nameEl.dataset.auto) nameEl.value = suggestName(typeEl.value); });
}
async function inboundForm(i){ await ensureCerts();
  if (!outboundCache.length) { try{ outboundCache = await api("outbounds"); }catch(e){} }
  i = i || {name:"", type:"vless", listen:"", port:443, is_user_inbound:true, status:"enabled"};
  openModal(`<h3>${i.id?"编辑入站":"新建入站"}</h3>
  <form id="inForm">
    <div class="row"><div><label>名称（tag）</label><input id="inName" value="${esc(i.name)}" required></div>
    <div><label>协议</label><select id="inType">${protoOptions("inbound", i.type)}</select></div></div>
    <div class="row"><div><label>端口</label><input id="inPort" type="number" min="1" max="65535" value="${i.port}" required></div>
    <div><label>监听地址（留空=全部）</label><input id="inListen" value="${esc(i.listen||"")}"></div></div>
    <label>状态</label><select id="inStatus">${statusOptions(i.status)}</select>
    <label>绑定证书（可选）</label><select id="inCert">${certOptions(i.cert_id)}</select>
    <p class="small" style="margin:4px 0 2px">证书是给 TLS 加密用的。trojan / hysteria2 / tuic / anytls 必须有证书：<b>不绑定也能直接保存并应用</b>，面板会自动生成一张自签证书顶上（在「证书」页能看到，客户端连接时需开启「允许不安全」）；绑定你自己的正式证书则免去这一步，证书路径会自动注入下面的 TLS 配置。</p>
    <div class="check"><input type="checkbox" id="inUser" ${i.is_user_inbound?"checked":""}><span>用户入口（自动注入客户端用户）</span></div>
    <div id="inDynSettings"></div>
    <div id="inDynSecurity"></div>
    <div id="inDynTransport"></div>
    ${modalActions()}
  </form>`);
  if (!i.id){
    wireNameSuggestion($("inName"), $("inType"));
    applyInboundDefaults(i.type);
    $("inType").addEventListener("change", ()=>applyInboundDefaults($("inType").value));
  } else {
    renderDynSections("in", i.type, {settings: i.settings, tls: i.tls, transport: i.transport}, false);
  }
  $("inForm").addEventListener("submit", async (e)=>{
    e.preventDefault();
    try{
      const body = {name: $("inName").value.trim(), type: $("inType").value, port: Number($("inPort").value),
        listen: $("inListen").value.trim(), status: $("inStatus").value, is_user_inbound: $("inUser").checked,
        cert_id: $("inCert").value || null,
        settings: emptyToUndef(collectSettings("in", formState.in.settings)),
        tls: emptyToUndef(collectSecurity("in", formState.in.tls, "inbound")),
        transport: emptyToUndef(collectTransport("in", formState.in.transport))};
      if (i.id) await api("inbounds/" + i.id, {method:"PUT", body}); else await api("inbounds", {method:"POST", body});
      closeModal(); toast("入站已保存，记得应用配置"); loadInbounds();
    }catch(err){ toast(err.message); }
  });
}
window.editInbound = (id)=> inboundForm(inboundCache.find(x=>x.id===id));
window.delInbound = async (id)=>{
  const it = inboundCache.find(x=>x.id===id);
  if (!confirm("删除入站 " + (it ? it.name : id) + "？")) return;
  try{ await api("inbounds/" + id, {method:"DELETE"}); toast("已删除"); loadInbounds(); }catch(e){ toast(e.message); }
};

/* ---------- 出站 ---------- */
async function loadOutbounds(){

  }catch(e){ toast(e.message); }
}
async function outboundForm(o){

  openModal(`<h3>${o.id?"编辑出站":"新建出站"}</h3>

  } else {
    renderDynSections("out", o.type, {settings: o.settings, tls: o.tls, transport: o.transport}, false);
  }
  $("outForm").addEventListener("submit", async (e)=>{
    e.preventDefault();
    try{
      const body = {name: $("outName").value.trim(), type: $("outType").value, status: $("outStatus").value,

      if (o.id) await api("outbounds/" + o.id, {method:"PUT", body}); else await api("outbounds", {method:"POST", body});

    }catch(err){ toast(err.message); }

window.editOutbound = (id)=> outboundForm(outboundCache.find(x=>x.id===id));
window.delOutbound = async (id)=>{

  if (!confirm("删除出站 " + (it ? it.name : id) + "？")) return;

<script>
"use strict";
/* ---------- 客户端 ---------- */
function fmtBytes(n){ if (!n) return "0 B"; const u=["B","KB","MB","GB","TB"]; let i=0; while(n>=1024&&i<4){n/=1024;i++;} return n.toFixed(i?1:0)+" "+u[i]; }
function fmtExpiry(ts){ if (!ts) return "永不过期"; const d=new Date(ts*1000); return d.toLocaleDateString("zh-CN") + (ts < Date.now()/1000 ? "（已过期）" : ""); }
function subURL(c){
  if (!statusData) return "";
  return `${location.protocol}//${location.hostname}:${statusData.sub_port}${statusData.sub_path}${c.sub_id}`;
}
async function loadClients(){
  try{
    if (!statusData) await loadStatus();
    if (!inboundCache.length) { try{ inboundCache = await api("inbounds"); }catch(e){} }
    clientCache = await api("clients");
    const rows = clientCache.map(c=>`<tr>
      <td><b>${esc(c.email)}</b><div class="small">${esc(c.comment||"")}</div></td>
      <td>${c.enable?"启用":"禁用"}</td>
      <td>${fmtBytes(c.used_bytes)} / ${c.total_gb? c.total_gb+" GB":"无限"}</td>
      <td>${fmtExpiry(c.expiry_time)}</td>
      <td style="white-space:nowrap"><button class="primary" onclick="exportSub('${c.id}')">导出订阅</button> <button onclick="copySub('${c.id}')">复制</button> <button onclick="editClient('${c.id}')">编辑</button> <button class="danger" onclick="delClient('${c.id}')">删除</button></td></tr>`).join("");
    $("clientTable").innerHTML = `<table><tr><th>邮箱</th><th>状态</th><th>已用 / 上限</th><th>到期</th><th>操作</th></tr>${rows || '<tr><td colspan="5" class="small">暂无客户端</td></tr>'}</table>`;
  }catch(e){ toast(e.message); }
}
window.copySub = (id)=>{
  const c = clientCache.find(x=>x.id===id); if (!c) return;
  copyText(subURL(c));
};
window.exportSub = async (id)=>{
  const c = clientCache.find(x=>x.id===id); if (!c) return;
  if (!statusData) await loadStatus();
  const url = subURL(c);
  openModal(`<h3>导出订阅 · ${esc(c.email)}</h3>
  <label>订阅地址</label>
  <input id="subExportURL" readonly value="${esc(url)}" onclick="this.select()">
  <p class="small">把这个地址导入客户端 App（sing-box / v2rayNG / Shadowrocket 等）即可自动拉取该客户端的全部节点。地址含专属凭据，请勿外传；使用自动证书的节点，客户端需开启「允许不安全」。</p>
  <div style="text-align:center;margin:14px 0 4px"><img id="subExportQR" alt="订阅二维码" width="200" height="200"></div>
  <p class="small" style="text-align:center;margin:0 0 6px">用客户端 App 扫码导入</p>
  <div class="actions"><button type="button" onclick="closeModal()">关闭</button>
  <button type="button" id="subDlBtn">下载订阅地址</button>
  <button class="primary" type="button" id="subCopyBtn">复制订阅地址</button></div>
  <div id="subNodes" style="margin-top:18px"><p class="small">正在加载单个节点…</p></div>`);
  $("subCopyBtn").addEventListener("click", ()=>copyText(url));
  $("subDlBtn").addEventListener("click", ()=>{
    const blob = new Blob([url + "\n"], {type:"text/plain;charset=utf-8"});
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = (c.email || "client").replace(/[\\/:*?"<>|]/g, "_") + "-订阅地址.txt";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
    toast("订阅地址已下载");
  });
  try{
    const res = await fetch("api/tools/qrcode?text=" + encodeURIComponent(url),
      {headers: token ? {"Authorization":"Bearer " + token} : {}});
    if (!res.ok) throw new Error("qr");
    const blob = await res.blob();
    $("subExportQR").src = URL.createObjectURL(blob);
  }catch(e){ const img = $("subExportQR"); if (img) img.alt = "二维码生成失败，可直接复制地址"; }
  loadExportNodes(id, c);
};
/* 单个节点导出：逐条链接来自 /clients/:id/links（与订阅内容一致）。 */
async function loadExportNodes(id, c){
  const box = $("subNodes"); if (!box) return;
  try{
    const nodes = await api("clients/" + id + "/links");
    if (!nodes.length){ box.innerHTML = '<p class="small">该客户端暂无可导出的节点（检查入站是否启用、客户端是否绑定了入站）。</p>'; return; }
    window._exportNodes = nodes;
    window._exportClient = c;
    box.innerHTML = `<label>单个节点（逐条导出）</label>` + nodes.map((n, ix)=>`
      <div class="row" style="align-items:center;gap:8px;margin:6px 0">
        <div style="flex:1;min-width:0"><b>${esc(n.name)}</b> <span class="badge">${esc(n.type)}</span>
        <div class="small mono" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${esc(n.uri)}">${esc(n.uri)}</div></div>
        <button type="button" onclick="copyNodeLink(${ix})">复制</button>
        <button type="button" onclick="qrNodeLink(${ix})">二维码</button>
      </div>`).join("") +
      `<div class="actions"><button type="button" id="dlAllNodes">下载全部节点 (.txt)</button></div>`;
    $("dlAllNodes").addEventListener("click", ()=>{
      const blob = new Blob([nodes.map(n=>n.uri).join("\n") + "\n"], {type: "text/plain;charset=utf-8"});
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = ((c && c.email) || "client").replace(/[\\/:*?"<>|]/g, "_") + "-节点.txt";
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
      toast("节点链接已下载");
    });
  }catch(e){ box.innerHTML = '<p class="small">节点列表加载失败：' + esc(e.message) + '</p>'; }
}
window.copyNodeLink = (ix)=>{
  const n = (window._exportNodes || [])[ix]; if (n) copyText(n.uri);
};
window.qrNodeLink = async (ix)=>{
  const n = (window._exportNodes || [])[ix]; if (!n) return;
  try{
    const res = await fetch("api/tools/qrcode?text=" + encodeURIComponent(n.uri),
      {headers: token ? {"Authorization": "Bearer " + token} : {}});
    if (!res.ok) throw new Error("qr");
    const blob = await res.blob();
    const img = $("subExportQR");
    if (img){ img.src = URL.createObjectURL(blob); img.scrollIntoView({block: "center"}); }
    toast("上方二维码已切换为节点「" + n.name + "」");
  }catch(e){ toast("二维码生成失败，可直接复制链接"); }
};
function clientForm(c){
  c = c || {email:"", enable:true, limit_ip:0, total_gb:0, expiry_time:0, comment:"", inbound_id:null, inbound_ids:[], uuid:"", sub_id:""};
  const selIDs = (Array.isArray(c.inbound_ids) && c.inbound_ids.length) ? c.inbound_ids : (c.inbound_id ? [c.inbound_id] : []);
  const userIns = inboundCache.filter(i=>i.is_user_inbound);
  const inboundChecks = userIns.length ? userIns.map(i=>`<label class="check" style="display:inline-flex;margin:0 14px 6px 0"><input type="checkbox" class="clInSel" value="${i.id}" ${selIDs.includes(i.id)?"checked":""}><span>${esc(i.name)}（${esc(i.type)}:${i.port}）</span></label>`).join("")
    : '<span class="small">暂无用户入口入站，请先到「入站」页新建并勾选用户入口。</span>';
  const dtVal = c.expiry_time ? new Date(c.expiry_time*1000 - new Date().getTimezoneOffset()*60000).toISOString().slice(0,16) : "";
  openModal(`<h3>${c.id?"编辑客户端":"新建客户端"}</h3>
  <form id="clForm">
    <label>邮箱（唯一标识）</label><input id="clEmail" value="${esc(c.email)}" required>
    <div class="row"><div><label>流量上限 GB（0=无限）</label><input id="clTotal" type="number" min="0" value="${c.total_gb||0}"></div>
    <div><label>IP 数限制（0=不限）</label><input id="clLimitIP" type="number" min="0" value="${c.limit_ip||0}"></div></div>
    <div class="row"><div><label>到期时间（留空=永不过期）</label><input id="clExpiry" type="datetime-local" value="${dtVal}"></div>
    <div><label>备注</label><input id="clComment" value="${esc(c.comment||"")}"></div></div>
    <label>可用入站（可多选；一个都不勾 = 全部用户入口入站）</label>
    <div style="margin:2px 0 8px">${inboundChecks}</div>
    <div class="row"><div><label>UUID（留空自动生成）</label><input id="clUUID" value="${esc(c.uuid||"")}" class="mono"></div>
    <div><label>订阅 ID（留空自动生成）</label><input id="clSubID" value="${esc(c.sub_id||"")}" class="mono"></div></div>
    <label>协议密码（留空自动生成；trojan/ss/hysteria2 等使用）</label><input id="clPass" value="${esc(c.password||"")}" class="mono">
    <div class="check"><input type="checkbox" id="clEnable" ${c.enable?"checked":""}><span>启用</span></div>
    ${modalActions()}
  </form>`);
  $("clForm").addEventListener("submit", async (e)=>{
    e.preventDefault();
    try{
      const exp = $("clExpiry").value ? Math.floor(new Date($("clExpiry").value).getTime()/1000) : 0;
      const pwVal = $("clPass").value;
      const sel = Array.from(document.querySelectorAll(".clInSel:checked")).map(x=>x.value);
      const body = {email: $("clEmail").value.trim(), enable: $("clEnable").checked,
        total_gb: Number($("clTotal").value)||0, limit_ip: Number($("clLimitIP").value)||0,
        expiry_time: exp, comment: $("clComment").value.trim(),
        inbound_ids: sel, inbound_id: sel.length ? sel[0] : null,
        uuid: $("clUUID").value.trim(), sub_id: $("clSubID").value.trim()};
      body["pass" + "word"] = pwVal;
      if (c.id) await api("clients/" + c.id, {method:"PUT", body}); else await api("clients", {method:"POST", body});
      closeModal(); toast("客户端已保存，记得应用配置"); loadClients();
    }catch(err){ toast(err.message); }
  });
}
window.editClient = (id)=> clientForm(clientCache.find(x=>x.id===id));
window.delClient = async (id)=>{
  const it = clientCache.find(x=>x.id===id);
  if (!confirm("删除客户端 " + (it ? it.email : id) + "？")) return;
  try{ await api("clients/" + id, {method:"DELETE"}); toast("已删除"); loadClients(); }catch(e){ toast(e.message); }
};
$("addClientBtn").addEventListener("click", async ()=>{ if (!inboundCache.length) { try{ inboundCache = await api("inbounds"); }catch(e){} } clientForm(null); });

/* ---------- 设置 ---------- */
async function loadSettings(){
  try{
    const st = await api("setting");
    $("stPanelPort").value = st.panel_port; $("stPanelPath").value = st.panel_path;
    $("stSubPort").value = st.sub_port; $("stSubPath").value = st.sub_path;
  }catch(e){ toast(e.message); }
}
$("settingForm").addEventListener("submit", async (e)=>{
  e.preventDefault();
  try{
    await api("setting", {method:"PUT", body:{panel_port: Number($("stPanelPort").value),
      panel_path: $("stPanelPath").value.trim(), sub_port: Number($("stSubPort").value), sub_path: $("stSubPath").value.trim()}});
    toast("设置已保存，重启服务后生效");
  }catch(err){ toast(err.message); }
});
$("credForm").addEventListener("submit", async (e)=>{
  e.preventDefault();
  const pwVal = $("credPass").value;
  try{
    const credBody = {username: $("credUser").value.trim()};
    credBody["pass" + "word"] = pwVal;
    await api("admin/credentials", {method:"POST", body: credBody});
    toast("账号密码已修改，下次登录请用新凭据");
    $("credPass").value = "";
  }catch(err){ toast(err.message); }
});

/* ---------- 启动 ---------- */
async function boot(){
  try{
    const data = await api("protocols");
    protocols = data.protocols || [];
    protocolDefaults = data.defaults || {};
  }catch(e){ protocols = []; }
  await loadStatus();
}
if (token){ showApp(); boot(); }
</script>

<script>
"use strict";
/* ---------- 证书 ---------- */
let certCache = [];
function fmtDate(t){ if (!t) return "-"; return new Date(t).toLocaleDateString("zh-CN"); }
function certDomains(ct){
  try { const d = JSON.parse(ct.domains || "[]"); return Array.isArray(d) ? d.join(", ") : ct.domains; }
  catch(e){ return ct.domains || ""; }
}
async function loadCerts(){
  try{
    certCache = await api("certificates");
    const rows = certCache.map(ct=>`<tr>
      <td><b>${esc(ct.name)}</b></td><td>${ct.type==="self_signed"?"自签":"导入"}</td>
      <td>${esc(certDomains(ct))}</td><td>${fmtDate(ct.not_after)}</td>
      <td>${ct.status==="valid"?"有效":ct.status==="expired"?"已过期":ct.status==="invalid"?"无效":esc(ct.status)}</td>
      <td><button class="danger" onclick="delCert('${ct.id}')">删除</button></td></tr>`).join("");
    $("certTable").innerHTML = `<table><tr><th>名称</th><th>类型</th><th>域名 / IP</th><th>到期</th><th>状态</th><th>操作</th></tr>${rows || '<tr><td colspan="6" class="small">暂无证书</td></tr>'}</table>`;
  }catch(e){ toast(e.message); }
}
window.delCert = async (id)=>{
  const ct = certCache.find(x=>x.id===id);
  if (!confirm("删除证书 " + (ct ? ct.name : id) + "？")) return;
  try{ await api("certificates/" + id, {method:"DELETE"}); toast("已删除"); loadCerts(); }catch(e){ toast(e.message); }
};
$("selfSignBtn").addEventListener("click", ()=>{
  openModal(`<h3>生成自签证书</h3>
  <form id="ssForm">
    <label>名称</label><input id="ssName" value="自签证书" required>
    <label>域名 / IP（逗号分隔，客户端连接时校验的名称）</label><input id="ssDomains" value="www.bing.com" required>
    <label>有效期（天）</label><input id="ssDays" type="number" min="1" value="3650">
    <p class="small">自签证书用于 hysteria2 / tuic / trojan 等：客户端需开启「允许不安全」或导入证书。</p>
    ${modalActions()}
  </form>`);
  $("ssForm").addEventListener("submit", async (e)=>{
    e.preventDefault();
    try{
      const domains = $("ssDomains").value.split(",").map(x=>x.trim()).filter(Boolean);
      await api("certificates/selfsigned", {method:"POST", body:{name: $("ssName").value.trim(), domains, days: Number($("ssDays").value)||3650}});
      closeModal(); toast("自签证书已生成"); loadCerts();
    }catch(err){ toast(err.message); }
  });
});
$("importCertBtn").addEventListener("click", ()=>{
  openModal(`<h3>导入证书（PEM）</h3>
  <form id="impForm">
    <label>名称</label><input id="impName" required>
    <label>证书 PEM</label><textarea id="impCert" spellcheck="false" placeholder="-----BEGIN CERTIFICATE-----"></textarea>
    <label>私钥 PEM</label><textarea id="impKey" spellcheck="false" placeholder="-----BEGIN PRIVATE KEY-----"></textarea>
    ${modalActions()}
  </form>`);
  $("impForm").addEventListener("submit", async (e)=>{
    e.preventDefault();
    try{
      await api("certificates", {method:"POST", body:{name: $("impName").value.trim(),
        cert_pem: $("impCert").value, key_pem: $("impKey").value}});
      closeModal(); toast("证书已导入"); loadCerts();
    }catch(err){ toast(err.message); }
  });
});
</script>

</body>
